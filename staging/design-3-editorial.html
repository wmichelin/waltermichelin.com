<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walter Michelin — Software Engineer</title>
    <meta name="description" content="Walter Michelin — software engineer building reliable backend systems in Python, Go, and JavaScript.">
    <!-- Staging mockup: no GA tag so prod analytics stay clean -->
    <style>
        :root {
            --bg: #0b0b0f;
            --fg: #f5f3ef;
            --muted: #8a8780;
            --line: #26252b;
            --accent: #ff5436;
            --accent2: #ffb43a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6vw 7vw;
            overflow-x: hidden;
        }
        .top {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
            color: var(--muted); margin-bottom: 8vh;
            animation: fade .8s ease both;
        }
        .top .avail { color: var(--fg); display: inline-flex; align-items: center; gap: 8px; }
        .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 0 0 var(--accent2); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,180,58,.6);} 70% { box-shadow: 0 0 0 10px rgba(255,180,58,0);} 100% { box-shadow: 0 0 0 0 rgba(255,180,58,0);} }
        h1 {
            font-size: clamp(56px, 16vw, 168px);
            line-height: .9;
            font-weight: 800;
            letter-spacing: -0.045em;
            margin: 0;
            animation: rise .8s cubic-bezier(.2,.7,.2,1) both;
        }
        h1 .grad {
            background: linear-gradient(105deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .role {
            font-size: clamp(18px, 2.4vw, 24px);
            color: var(--muted);
            margin-top: 26px;
            max-width: 46ch;
            animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both;
        }
        .role b { color: var(--fg); font-weight: 600; }
        .row {
            margin-top: 7vh;
            display: flex;
            flex-wrap: wrap;
            gap: 40px 64px;
            align-items: flex-start;
            animation: rise .8s .2s cubic-bezier(.2,.7,.2,1) both;
        }
        .col-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
        .stack { display: flex; flex-wrap: wrap; gap: 10px 22px; max-width: 30ch; }
        .stack span { font-size: 16px; color: var(--fg); }
        .stack span::before { content: "↳ "; color: var(--accent); }
        .links { display: flex; flex-direction: column; gap: 10px; }
        .links a {
            color: var(--fg); text-decoration: none; font-size: 17px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 10px;
            transition: gap .15s, color .15s;
        }
        .links a .arrow { color: var(--accent); transition: transform .15s; }
        .links a:hover { color: var(--accent); }
        .links a:hover .arrow { transform: translateX(4px); }
    </style>
</head>
<body>
    <header class="top">
        <span>Walter Michelin</span>
        <span class="avail"><span class="pulse"></span> Open to work</span>
    </header>

    <h1>Software<br><span class="grad">Engineer.</span></h1>
    <p class="role">
        I design and ship reliable backend systems —
        <b><span id="yoe"></span> years</b> turning hard problems into
        software that holds up in production.
    </p>

    <div class="row">
        <div>
            <div class="col-label">Technologies</div>
            <div class="stack">
                <span>Python</span><span>Go</span><span>JavaScript</span>
                <span>React</span><span>Cassandra</span><span>Redis</span>
                <span>PostgreSQL</span>
            </div>
        </div>
        <div>
            <div class="col-label">Elsewhere</div>
            <nav class="links">
                <a href="https://github.com/wmichelin"><span class="arrow">→</span> GitHub</a>
                <a href="https://www.linkedin.com/in/waltermichelin"><span class="arrow">→</span> LinkedIn</a>
                <a href="mailto:wmichelin@gmail.com"><span class="arrow">→</span> Email</a>
                <a href="/dadjokes"><span class="arrow">→</span> Dad Jokes</a>
            </nav>
        </div>
    </div>

    <script>
        document.getElementById('yoe').textContent = new Date().getFullYear() - 2014;
    </script>
</body>
</html>
