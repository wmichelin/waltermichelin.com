    <style>
        /* Page-specific bits, built on the shared design tokens in index.css. */
        .joke {
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            border-radius: 14px;
            padding: 28px 26px;
            margin: 4px 0 28px;
            min-height: 132px;
            display: flex;
            align-items: center;
            font-size: 20px;
            line-height: 1.5;
            color: var(--fg);
        }
        .joke.loading { color: var(--muted); font-style: italic; }

        .generate-btn {
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--surface);
            background: var(--accent);
            border: none;
            border-radius: 999px;
            padding: 12px 26px;
            cursor: pointer;
            margin-bottom: 36px;
            transition: transform .15s, opacity .15s;
        }
        .generate-btn:hover { opacity: .92; transform: translateY(-1px); }
        .generate-btn:active { transform: translateY(0); }
        .generate-btn:disabled { opacity: .55; cursor: default; transform: none; }
    </style>
</head>
<body>
    <main class="card">
        <div class="eyebrow">Just for fun</div>
        <h1 class="header">Dad Joke Generator</h1>
        <p class="lede">
            Fresh cuts and fresh jokes — hit the button for a groan-worthy
            classic that's so bad, it's good.
        </p>

        <blockquote class="joke" id="joke-text" aria-live="polite">
            Click the button for a dad joke so bad it's good.
        </blockquote>

        <button class="generate-btn" id="generate-btn" type="button">
            Tell me another 🚜

        <nav class="links" aria-label="Site navigation">
